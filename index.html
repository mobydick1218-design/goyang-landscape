<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>고양시 대표경관자원</title>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="home-btn" id="homeBtn" title="전체보기">
      <span class="logo-dot"></span><span id="siteTitle">고양시 대표경관자원</span>
    </button>
    <div class="search">
      <input id="searchInput" type="search" placeholder="자원·조망점·요소·설명 검색" autocomplete="off">
      <ul id="searchResults" class="search-results" hidden></ul>
    </div>
  </header>

  <main class="layout">
    <div id="map"></div>

    <!-- 지도 위 컨트롤 -->
    <div class="map-ctrl basemap" role="group" aria-label="배경지도">
      <button data-base="normal" class="on">일반지도</button>
      <button data-base="satellite">위성지도</button>
    </div>
    <div class="map-ctrl legend" id="legend" hidden>
      <button class="legend-title" id="legendToggle">범례 · 표시 <span class="chev">▾</span></button>
      <div id="legendItems"></div>
    </div>

    <aside class="panel" id="panel">
      <button class="panel-handle" id="panelHandle" aria-label="패널 접기/펼치기"></button>
      <div class="panel-body" id="panelBody"></div>
    </aside>
  </main>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" id="lbClose" aria-label="닫기">×</button>
    <button class="lb-nav prev" id="lbPrev" aria-label="이전">‹</button>
    <img id="lbImg" alt="">
    <button class="lb-nav next" id="lbNext" aria-label="다음">›</button>
    <div class="lb-count" id="lbCount"></div>
  </div>

  <script src="vendor/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
