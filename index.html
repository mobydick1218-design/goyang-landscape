<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>고양시 대표경관자원 지도</title>
  <meta name="description" content="고양시 경관계획 재정비 수립 용역 – 대표경관자원 조사결과 지도">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <aside id="panel" aria-label="정보 패널">
      <div class="sheet-handle" id="sheetHandle" role="button" aria-label="패널 펼치기/접기"><span></span></div>
      <header class="panel-head">
        <a class="brand" href="#" id="brand">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 11.2 12 4l9 7.2" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9.5h4.5v-5.5h4v5.5h4.5V10" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg></span>
          <span><strong>고양시 대표경관자원</strong><small>경관계획 재정비 · 조사결과 지도</small></span>
        </a>
        <div class="search">
          <input id="searchInput" type="search" placeholder="자원, 조망점, 요소 이름 검색" autocomplete="off">
        </div>
      </header>
      <div class="panel-body" id="panelBody"></div>
    </aside>

    <main id="mapWrap">
      <div id="map"></div>

      <div class="map-ui top-right">
        <div class="seg" role="group" aria-label="지도 종류">
          <button data-type="ROADMAP" class="on">일반</button>
          <button data-type="HYBRID">위성</button>
        </div>
        <div class="legend" id="legend" hidden>
          <div class="legend-title">범례 <small>눌러서 켜기/끄기</small></div>
          <label><input type="checkbox" data-layer="VP" checked><i class="sym vp"><svg viewBox="-13 -16 26 28" width="16" height="16"><path d="M0 0 L-7 -12 A14 14 0 0 1 7 -12 Z" fill="#e0592a" fill-opacity=".35"/><circle r="5.5" fill="#e0592a" stroke="#fff" stroke-width="1.5"/></svg></i>조망점 (부채꼴: 조망 방향)</label>
          <label><input type="checkbox" data-layer="LE" checked><i class="sym le"></i>구성요소</label>
          <label><input type="checkbox" data-layer="BE" checked><i class="sym be"></i>배경요소</label>
          <label><input type="checkbox" data-layer="etc" checked><i class="sym etc"></i>기타</label>
          <label><input type="checkbox" data-layer="LABEL" checked><i class="sym lab">가</i>이름 표시</label>
        </div>
      </div>

      <div class="map-ui bottom-right">
        <button class="round" id="btnLocate" title="내 위치" aria-label="내 위치">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <div class="zoom">
          <button id="zoomIn" aria-label="확대">+</button>
          <button id="zoomOut" aria-label="축소">−</button>
        </div>
      </div>

      <div class="toast" id="toast" hidden></div>
    </main>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" aria-label="닫기">×</button>
    <button class="lb-nav prev" aria-label="이전 사진">‹</button>
    <figure><img alt=""><figcaption></figcaption></figure>
    <button class="lb-nav next" aria-label="다음 사진">›</button>
  </div>

  <script src="js/config.js"></script>
  <script>
    (function () {
      var s = document.createElement("script");
      s.src = "https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&appkey=" + SITE_CONFIG.KAKAO_KEY;
      s.onload = function () {
        if (!window.kakao || !kakao.maps) { window.__mapState = "failed"; window.APP && APP.mapFailed(); return; }
        kakao.maps.load(function () { window.__mapState = "ready"; window.APP && APP.start(); });
      };
      s.onerror = function () { window.__mapState = "failed"; window.APP && APP.mapFailed(); };
      document.head.appendChild(s);
    })();
  </script>
  <script src="js/app.js"></script>
</body>
</html>
